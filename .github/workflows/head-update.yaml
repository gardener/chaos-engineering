name: CI (head-update)
on:
  push

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
      id-token: write
    with:
      mode: snapshot

  post-build:
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
    needs:
      - build
    permissions:
      contents: write
      id-token: write
