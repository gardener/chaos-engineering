name: CI (head-update)
on:
  push

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
      id-token: write
    with:
      mode: snapshot

  post-build:
    uses: gardener/cc-utils/.github/workflows/post-build.yaml@00522ef3e8504bc7be46394a239a390f112336f6 # 1.2883.0
    needs:
      - build
    permissions:
      contents: write
      id-token: write
